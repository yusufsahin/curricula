[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "course"
version = "0.1.0"
description = "Local-first Turkish SAP ABAP curriculum intelligence from training videos"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "videotocontent" }]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "networkx>=3.3",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.0"]
visual = ["opencv-python-headless>=4.9.0", "Pillow>=10.3.0"]
export = ["python-docx>=1.1.0", "markdown>=3.6", "mkdocs>=1.6.0"]
llm = ["litellm>=1.40.0"]
api = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0", "httpx>=0.27.0"]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-setuptools",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
]

[project.scripts]
course = "course.cli.app:main"

[tool.hatch.build.targets.sdist]
include = ["src/course", "config", "docs", "alembic", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses Depends(...) in defaults by design.
"src/course/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["course"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "faster_whisper.*",
  "cv2.*",
  "networkx.*",
  "litellm.*",
  "docx.*",
  "uvicorn.*",
]
ignore_missing_imports = true
